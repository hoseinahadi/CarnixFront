name: Deploy CarnixFront (Next.js)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted 

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Install Packages
        working-directory: ./ui
        run: npm install

      - name: 🏗️ Build Next.js App
        working-directory: ./ui
        run: npm run build

      - name: 📂 Copy to Deployment Folder
        run: |
          if (!(Test-Path C:\Deploy\CarnixFront)) { New-Item -ItemType Directory -Force -Path C:\Deploy\CarnixFront }
          Copy-Item -Path .\ui\* -Destination C:\Deploy\CarnixFront -Recurse -Force

      - name: 🚀 Manage PM2 Service
        working-directory: C:\Deploy\CarnixFront
        run: |
          $env:PM2_HOME = "C:\Deploy\.pm2"
          npx pm2 restart carnix-front
          if ($LASTEXITCODE -ne 0) {
            npx pm2 start npm --name "carnix-front" -- run start
          }